<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cari Anime - Kazanime</title>
    <meta name="description" content="Cari anime dan cek server dengan Multi Sub atau bahasa subtitle lain sesuai ketersediaan tiap judul.">
    <link rel="icon" type="image/jpeg" href="https://media.kitsu.app/characters/images/92508/original.jpg">
    <meta name="robots" content="noindex, follow">
    <script src="js/theme-preload.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/search.css">
    <script type="module" src="js/search.js"></script>
</head>
<body data-page="search">

<div id="app-navbar"></div>

<noscript><p class="noscript-warning">Pencarian Kazanime membutuhkan JavaScript.</p></noscript>

<main class="main-content" id="main">
    <section class="search-results-section" id="searchResultsSection">

        <div class="search-results-header">
            <h2 id="searchResultsTitle">Hasil Pencarian</h2>
            <p id="searchResultsSubtitle" aria-live="polite"></p>
        </div>

        <!-- Tab sumber data (hanya untuk mode pencarian) -->
        <div class="search-source-tabs" id="searchSourceTabs" role="tablist" aria-label="Sumber data">
            <button type="button" class="search-source-tab active" role="tab" aria-selected="true" data-source="all"><span class="ic-slot" data-icon="library"></span>Semua <span class="count" data-count="all">0</span></button>
            <!-- Putaran 10 (24 Okt 2026): hasil AnimeKu & Oploverz punya tab sendiri,
                 supaya bisa difilter dan tidak tercampur dengan metadata. -->
            <button type="button" class="search-source-tab" role="tab" aria-selected="false" data-source="backend:animeku"><span class="src-dot src-dot--animeku" aria-hidden="true"></span>AnimeKu <span class="count" data-count="backend:animeku">0</span></button>
            <button type="button" class="search-source-tab" role="tab" aria-selected="false" data-source="backend:oploverz"><span class="src-dot src-dot--oploverz" aria-hidden="true"></span>Oploverz <span class="count" data-count="backend:oploverz">0</span></button>
            <button type="button" class="search-source-tab" role="tab" aria-selected="false" data-source="anilist"><span class="src-dot src-dot--anilist" aria-hidden="true"></span>AniList <span class="count" data-count="anilist">0</span></button>
            <button type="button" class="search-source-tab" role="tab" aria-selected="false" data-source="kitsu"><span class="src-dot src-dot--kitsu" aria-hidden="true"></span>Kitsu <span class="count" data-count="kitsu">0</span></button>
        </div>

        <!-- Urutan (eksklusif) + format (bisa lebih dari satu) -->
        <div class="search-filters" id="searchFilters">
            <button type="button" class="search-filter-btn active" data-sort="relevance" aria-pressed="true"><span class="ic-slot" data-icon="search"></span>Relevansi</button>
            <button type="button" class="search-filter-btn" data-sort="score" aria-pressed="false"><span class="ic-slot" data-icon="star"></span>Rating</button>
            <button type="button" class="search-filter-btn" data-sort="popularity" aria-pressed="false"><span class="ic-slot" data-icon="flame"></span>Populer</button>
            <button type="button" class="search-filter-btn" data-sort="newest" aria-pressed="false"><span class="ic-slot" data-icon="clock"></span>Terbaru</button>
            <span class="search-filters-divider" aria-hidden="true"></span>
            <button type="button" class="search-filter-btn" data-format="TV" aria-pressed="false"><span class="ic-slot" data-icon="tv"></span>TV</button>
            <button type="button" class="search-filter-btn" data-format="MOVIE" aria-pressed="false"><span class="ic-slot" data-icon="clapperboard"></span>Movie</button>
            <button type="button" class="search-filter-btn" data-format="OVA" aria-pressed="false"><span class="ic-slot" data-icon="disc-3"></span>OVA</button>
            <button type="button" class="search-filter-btn" data-format="ONA" aria-pressed="false"><span class="ic-slot" data-icon="globe"></span>ONA</button>
        </div>

        <div class="anime-grid" id="searchResultsGrid" aria-busy="true"></div>

        <div class="search-load-more" id="searchLoadMore" hidden>
            <button type="button" class="btn-load-more" id="searchLoadMoreBtn">Muat Lebih Banyak ↓</button>
        </div>

    </section>

    <!-- 24 Okt 2026 (putaran 7): hasil AnimeKu & Oploverz untuk kata kunci yang sama.
         Dipisah dari grid metadata karena kartunya memutar episode langsung dari situs. -->
    <section class="search-site-section" id="searchSiteResults" hidden aria-labelledby="searchSiteTitle">
        <div class="section-header">
            <h2 class="section-title" id="searchSiteTitle"><span class="section-icon" aria-hidden="true"><span class="ic-slot" data-icon="server"></span></span><span class="section-title-text">Langsung dari AnimeKu &amp; Oploverz</span></h2>
        </div>
        <p class="search-site-note" id="searchSiteNote"></p>
        <div class="anime-grid" id="searchSiteGrid"></div>
    </section>
</main>

<div id="app-footer"></div>

<!-- Vercel Web Analytics -->
<script defer src="/_vercel/insights/script.js"></script>

</body>
</html>
