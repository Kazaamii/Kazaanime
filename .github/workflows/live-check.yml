name: live-check (sementara)
# Workflow SEMENTARA untuk verifikasi langsung situs sumber dari runner ber-internet.
# Akan dihapus setelah pengujian selesai.
on:
  push:
    branches: [arena/adbff310-kazaanime]
    paths: ['.github/workflows/live-check.yml', 'tools/live-check/**']
permissions:
  contents: write
concurrency:
  group: live-check
  cancel-in-progress: false
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - name: Uji end-to-end (server asli → situs live)
        run: |
          LOG_REQUESTS=1 node server/index.js > .live-check-server.log 2>&1 &
          node tools/live-check/e2e.mjs
      - name: Uji UI (Playwright Chromium)
        run: |
          npm i --no-save --no-audit --no-fund playwright@1
          npx playwright install --with-deps chromium
          node tools/live-check/ui.mjs || true
          mkdir -p .live-check && tail -n 120 .live-check-server.log > .live-check/server.log || true
      - name: Commit hasil
        run: |
          git config user.name "live-check[bot]"
          git config user.email "live-check@users.noreply.github.com"
          cp .live-check/e2e.json ".live-check/e2e-${GITHUB_RUN_ID}.json" 2>/dev/null || true
          git add -f .live-check
          git commit -m "chore: hasil live-check (sementara) [skip ci]" || exit 0
          git pull --rebase -X theirs origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
