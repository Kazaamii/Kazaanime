name: sample-upstream (sementara)

on:
  push:
    branches: [arena/b55bc2a7-kazaanime]
    paths: ['.github/workflows/sample-upstream.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sample:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/b55bc2a7-kazaanime
      - name: Fetch samples
        run: |
          set -u
          mkdir -p samples3
          UA='KazanimeBot/1.0 (+https://github.com/Kazaamii/Kazaanime; contact)'
          fetch() {
            name="$1"; url="$2"
            code=$(curl -sS -L --compressed --max-time 45 -A "$UA" \
              -H 'Accept: text/html,application/xhtml+xml' \
              -o "samples3/$name.out" -w '%{http_code}' "$url" || echo 000)
            bytes=$(wc -c < "samples3/$name.out" | tr -d ' ')
            printf '%s\t%s\t%s\t%s\n' "$name" "$code" "$bytes" "$url" >> samples3/manifest.txt
            sleep 1
          }
          fetch animeku-abjad        'https://ww2.animeku.lol/abjad/'
          fetch animeku-g-aksi 'https://ww2.animeku.lol/genre/aksi/'
          fetch animeku-g-petualangan 'https://ww2.animeku.lol/genre/petualangan/'
          fetch animeku-g-komedi 'https://ww2.animeku.lol/genre/komedi/'
          fetch animeku-g-drama 'https://ww2.animeku.lol/genre/drama/'
          fetch animeku-g-fantasi 'https://ww2.animeku.lol/genre/fantasi/'
          fetch animeku-g-horor 'https://ww2.animeku.lol/genre/horor/'
          fetch animeku-g-mecha 'https://ww2.animeku.lol/genre/mecha/'
          fetch animeku-g-musik 'https://ww2.animeku.lol/genre/musik/'
          fetch animeku-g-misteri 'https://ww2.animeku.lol/genre/misteri/'
          fetch animeku-g-psikologis 'https://ww2.animeku.lol/genre/psikologis/'
          fetch animeku-g-romantis 'https://ww2.animeku.lol/genre/romantis/'
          fetch animeku-g-sci_fi 'https://ww2.animeku.lol/genre/sci-fi/'
          fetch animeku-g-olahraga 'https://ww2.animeku.lol/genre/olahraga/'
          fetch animeku-g-thriller 'https://ww2.animeku.lol/genre/thriller/'
          fetch animeku-g-ecchi 'https://ww2.animeku.lol/genre/ecchi/'
          fetch animeku-g-isekai 'https://ww2.animeku.lol/genre/isekai/'
          fetch animeku-g-mahou_shoujo 'https://ww2.animeku.lol/genre/mahou-shoujo/'
          fetch animeku-g-slice_of_life 'https://ww2.animeku.lol/genre/slice-of-life/'
          fetch animeku-g-kehidupan_sehari_hari 'https://ww2.animeku.lol/genre/kehidupan-sehari-hari/'
          fetch animeku-g-shoujo 'https://ww2.animeku.lol/genre/shoujo/'
          fetch animeku-g-josei 'https://ww2.animeku.lol/genre/josei/'
          fetch animeku-g-sekolah 'https://ww2.animeku.lol/genre/sekolah/'
          fetch animeku-g-vampir 'https://ww2.animeku.lol/genre/vampir/'
          fetch animeku-g-laga 'https://ww2.animeku.lol/genre/laga/'
          fetch animeku-g-animasi 'https://ww2.animeku.lol/genre/animasi/'
          fetch animeku-g-sejarah 'https://ww2.animeku.lol/genre/sejarah/'
          fetch animeku-g-shounen 'https://ww2.animeku.lol/genre/shounen/'
          fetch animeku-g-seinen 'https://ww2.animeku.lol/genre/seinen/'
          fetch animeku-g-supernatural 'https://ww2.animeku.lol/genre/supernatural/'
          cat samples3/manifest.txt
      - name: Commit samples
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add samples3
          git commit -m 'chore(sample): probe genre index & donghua [skip ci]' || echo 'nothing to commit'
          git push origin HEAD:arena/b55bc2a7-kazaanime
