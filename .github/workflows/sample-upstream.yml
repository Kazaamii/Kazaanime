name: sample-upstream (sementara)

# SEMENTARA — hanya untuk mengambil HTML asli dari upstream lewat runner GitHub
# (sandbox pengembangan tidak punya jalur keluar ke situs-situs ini).
# Dihapus sebelum PR.

on:
  push:
    branches: [arena/e0eda340-kazaanime]
    paths:
      - '.github/workflows/sample-upstream.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sample:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/e0eda340-kazaanime

      - name: Ambil halaman contoh
        shell: bash
        run: |
          set -u
          UA='KazanimeBot/1.0 (+https://github.com/Kazaamii/Kazaanime)'
          mkdir -p samples2
          : > samples2/manifest.txt

          fetch() {
            name="$1"; url="$2"; ua="${3:-$UA}"
            code=$(curl -sS -L --compressed --max-time 45 \
              -A "$ua" \
              -H 'Accept: text/html,application/xhtml+xml' \
              -o "samples2/$name.html" -w '%{http_code}' "$url" || echo 000)
            bytes=$(wc -c < "samples2/$name.html" 2>/dev/null || echo 0)
            if [ "$bytes" -gt 500000 ]; then head -c 500000 "samples2/$name.html" > "samples2/$name.tmp"; mv "samples2/$name.tmp" "samples2/$name.html"; bytes=$((bytes>500000?500000:bytes)); fi
            printf '%s\t%s\t%s\t%s\n' "$name" "$code" "$bytes" "$url" >> samples2/manifest.txt
            echo "$name -> $code ($bytes bytes)"
            sleep 2
          }

          # AnimeKu (UA bot jujur; UA browser dari IP pusat data dibalas 403)
          fetch animeku-home        'https://ww2.animeku.lol/'
          fetch animeku-baru        'https://ww2.animeku.lol/baru-utnwb9y/'
          fetch animeku-baru-2      'https://ww2.animeku.lol/baru-utnwb9y/page/2/'
          fetch animeku-ongoing     'https://ww2.animeku.lol/jalan-uf5ms8g/'
          fetch animeku-selesai     'https://ww2.animeku.lol/selesai-bjyzaqn/'
          fetch animeku-favorit     'https://ww2.animeku.lol/favorit-sixkqhv/'
          fetch animeku-film        'https://ww2.animeku.lol/film-anime-6d23pb8/'
          fetch animeku-genre       'https://ww2.animeku.lol/genre/'

          # Oploverz (tanpa UA khusus)
          fetch oploverz-order-update   'https://oploverz.ch/series/?order=update'
          fetch oploverz-order-popular  'https://oploverz.ch/series/?order=popular'
          fetch oploverz-order-rating   'https://oploverz.ch/series/?order=rating'
          fetch oploverz-status-upcoming 'https://oploverz.ch/series/?status=upcoming'
          fetch oploverz-type-movie     'https://oploverz.ch/series/?type=movie'
          fetch oploverz-type-drama     'https://oploverz.ch/series/?type=drama'
          fetch oploverz-genre-action   'https://oploverz.ch/series/?genre%5B%5D=action'
          fetch oploverz-page2          'https://oploverz.ch/series/page/2/'

      - name: Commit hasil
        run: |
          git config user.name 'Kazaanime sampler'
          git config user.email 'noreply@github.com'
          git add samples2
          if git diff --cached --quiet; then echo 'tidak ada perubahan'; exit 0; fi
          git commit -m 'chore(sample): halaman daftar Animeku & Oploverz [skip ci]'
          git push origin HEAD:arena/e0eda340-kazaanime

