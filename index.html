<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kazanime - Streaming Anime Multi Sub</title>
    <meta name="description" content="Temukan anime dengan pilihan Multi Sub dan bahasa lain sesuai ketersediaan tiap judul dan server. Streaming hingga 1080p.">
    <link rel="icon" type="image/jpeg" href="https://media.kitsu.app/characters/images/92508/original.jpg">
    <!-- Terapkan tema tersimpan SEBELUM render pertama (mencegah kedip tema) -->
    <script src="js/theme-preload.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/home.css">
    <script type="module" src="js/home.js"></script>
</head>
<body data-page="home">

<!-- Navbar (komponen bersama, dirender oleh js/ui/navbar.js) -->
<div id="app-navbar"></div>

<noscript><p class="noscript-warning">Kazanime membutuhkan JavaScript untuk memuat daftar anime. Aktifkan JavaScript lalu muat ulang halaman.</p></noscript>

<main class="main-content" id="main">

    <!-- HERO SLIDER -->
    <section class="hero" id="hero" aria-roledescription="carousel" aria-label="Anime trending">
        <div class="hero-slider" id="heroSlider"></div>
        <div class="hero-overlay"></div>
        <div class="hero-content">
            <div id="heroContent" aria-live="polite">
                <div class="hero-skeleton" aria-hidden="true">
                    <div class="skeleton-line loading-shimmer"></div>
                    <div class="skeleton-line loading-shimmer"></div>
                    <div class="skeleton-line loading-shimmer"></div>
                    <div class="skeleton-line loading-shimmer"></div>
                </div>
            </div>
        </div>
        <div class="hero-navigation">
            <button class="hero-nav-btn hero-prev" type="button" data-hero="prev" aria-label="Slide sebelumnya"><span class="ic-slot" data-icon="chevron-left"></span></button>
            <button class="hero-nav-btn hero-next" type="button" data-hero="next" aria-label="Slide berikutnya"><span class="ic-slot" data-icon="chevron-right"></span></button>
        </div>
        <div class="hero-dots" id="heroDots"></div>
    </section>

    <!-- JADWAL RILIS — paling atas (permintaan 24 Okt 2026) -->
    <section class="section" id="jadwal">
        <div class="section-header"><h2 class="section-title"><span class="section-icon" aria-hidden="true"><span class="ic-slot" data-icon="calendar-days"></span></span><span class="section-title-text">Jadwal Rilis</span></h2></div>
        <div class="schedule-grid" id="scheduleGrid"></div>
        <p class="schedule-note" id="scheduleNote"></p>
    </section>

    <!-- GENRE — paling atas bersama Jadwal (permintaan 24 Okt 2026). Filter Tahun/Musim/Urutkan. -->
    <section class="section" id="genre">
        <div class="section-header"><h2 class="section-title"><span class="section-icon" aria-hidden="true"><span class="ic-slot" data-icon="tags"></span></span><span class="section-title-text">Jelajahi Genre</span></h2></div>
        <div class="genre-filters" role="group" aria-label="Filter genre">
            <label class="genre-filter" for="genreYear">
                <span>Tahun</span>
                <select id="genreYear"></select>
            </label>
            <label class="genre-filter" for="genreSeason">
                <span>Musim</span>
                <select id="genreSeason">
                    <option value="">Semua musim</option>
                    <option value="winter">Winter (Jan–Mar)</option>
                    <option value="spring">Spring (Apr–Jun)</option>
                    <option value="summer">Summer (Jul–Sep)</option>
                    <option value="fall">Fall (Okt–Des)</option>
                </select>
            </label>
            <label class="genre-filter" for="genreSort">
                <span>Urutkan</span>
                <select id="genreSort">
                    <option value="popularity">Terpopuler</option>
                    <option value="score">Rating tertinggi</option>
                    <option value="newest">Terbaru</option>
                </select>
            </label>
            <button type="button" class="genre-filter-reset" id="genreFilterReset" hidden>Reset filter</button>
        </div>
        <div class="genre-tags" id="genreTags" role="toolbar" aria-label="Pilih genre"></div>
        <!-- Genre situs (AnimeKu/Oploverz ±70) tidak lagi dijajarkan di beranda — 24 Okt 2026,
             permintaan pengguna: "dibuat tombol menu genre agar tidak panjang". -->
        <div class="genre-menu-wrap">
            <button type="button" class="genre-menu-btn" id="genreMenuBtn" aria-expanded="false" aria-controls="genreMenu" hidden>
                <span class="ic-slot" data-icon="tags"></span>
                <span>Genre situs</span>
                <span class="genre-menu-count" id="genreMenuCount" hidden></span>
                <span class="ic-slot genre-menu-caret" data-icon="chevron-down"></span>
            </button>
            <div class="genre-menu" id="genreMenu" hidden>
                <div class="genre-menu-head">
                    <label class="sr-only" for="genreMenuSearch">Cari genre situs</label>
                    <input type="search" class="genre-menu-search" id="genreMenuSearch" placeholder="Cari genre…" autocomplete="off" enterkeyhint="search">
                    <button type="button" class="genre-menu-close" id="genreMenuClose" aria-label="Tutup daftar genre">
                        <span class="ic-slot" data-icon="x"></span>
                    </button>
                </div>
                <div class="genre-menu-body" id="genreMenuBody"></div>
                <p class="genre-menu-foot">
                    <span class="genre-menu-empty" id="genreMenuEmpty" hidden>Tidak ada genre yang cocok.</span>
                    <a class="see-all" href="katalog.html">Buka Jelajah <span class="ic-slot" data-icon="chevron-right"></span></a>
                </p>
            </div>
        </div>
        <div class="genre-results" id="genreResults" hidden>
            <div class="genre-results-head">
                <h3 class="genre-results-title" id="genreResultsTitle">Genre</h3>
                <div class="genre-results-actions">
                    <a href="search.html" class="see-all" id="genreSeeAll">Lihat Semua <span class="ic-slot" data-icon="chevron-right"></span></a>
                    <button type="button" class="genre-close" id="genreClose" aria-label="Tutup hasil genre"><span class="ic-slot" data-icon="x"></span></button>
                </div>
            </div>
            <div class="anime-grid" id="genreGrid" aria-live="polite" aria-busy="false"></div>
        </div>
    </section>

    <!-- RILIS ANIME JEPANG SUB INDO, DIPISAH PER SUMBER (tanpa verifikasi episode, 24 Okt 2026) -->
    <section class="section" id="subindo" aria-labelledby="subIndoTitle">
        <div class="section-header subindo-section-header">
            <h2 class="section-title" id="subIndoTitle">
                <span class="section-icon" aria-hidden="true"><span class="ic-slot" data-icon="captions"></span></span>
                <span class="section-title-text">Anime Jepang Sub Indo</span>
            </h2>
            <div class="subindo-header-actions">
                <span class="subindo-label">Katalog langsung dari AnimeKu &amp; Oploverz</span>
                <button type="button" class="subindo-refresh" id="subIndoRefresh" aria-label="Muat ulang daftar Sub Indo">
                    <span class="ic-slot" data-icon="refresh-cw"></span><span class="subindo-refresh-text">Muat ulang</span>
                </button>
            </div>
        </div>
        <p class="subindo-status" id="subIndoStatus" role="status" aria-live="polite"></p>
        <div class="subindo-sources" id="subindoSources" aria-live="polite" aria-busy="true"></div>
    </section>

    <!-- ONGOING -->
    <section class="section" id="ongoing">
        <div class="section-header">
            <h2 class="section-title"><span class="section-icon" aria-hidden="true"><span class="ic-slot" data-icon="radio-tower"></span></span><span class="section-title-text">Ongoing Anime</span></h2>
            <a href="search.html?browse=ongoing" class="see-all">Lihat Semua <span class="ic-slot" data-icon="chevron-right"></span></a>
        </div>
        <div class="anime-grid" id="ongoingGrid" aria-busy="true"></div>
    </section>

    <!-- POPULER -->
    <section class="section" id="popular">
        <div class="section-header">
            <h2 class="section-title"><span class="section-icon" aria-hidden="true"><span class="ic-slot" data-icon="flame"></span></span><span class="section-title-text">Anime Populer</span></h2>
            <a href="search.html?browse=popular" class="see-all" id="popularSeeAll">Lihat Semua <span class="ic-slot" data-icon="chevron-right"></span></a>
        </div>
        <div class="anime-grid" id="popularGrid" aria-busy="true"></div>
    </section>

    <!-- BOOKMARK (hanya tampil saat login) -->
    <!-- BARU RILIS -->
    <section class="section" id="baru-rilis">
        <div class="section-header">
            <h2 class="section-title"><span class="section-icon" aria-hidden="true"><span class="ic-slot" data-icon="sparkles"></span></span><span class="section-title-text">Baru Rilis</span></h2>
            <a href="search.html?browse=new" class="see-all">Lihat Semua <span class="ic-slot" data-icon="chevron-right"></span></a>
        </div>
        <div class="anime-grid" id="newReleaseGrid" aria-busy="true"></div>
    </section>

    <!-- DONGHUA -->
    <section class="section" id="donghua">
        <div class="section-header subindo-section-header">
            <h2 class="section-title"><span class="section-icon" aria-hidden="true"><span class="ic-slot" data-icon="swords"></span></span><span class="section-title-text">Donghua (Anime China)</span></h2>
            <div class="subindo-header-actions">
                <a href="search.html?browse=donghua" class="see-all">Lihat Semua <span class="ic-slot" data-icon="chevron-right"></span></a>
                <button type="button" class="subindo-refresh" id="donghuaRefresh" aria-label="Muat ulang donghua AnimeKu &amp; Oploverz">
                    <span class="ic-slot" data-icon="refresh-cw"></span><span class="subindo-refresh-text">Muat ulang</span>
                </button>
            </div>
        </div>
        <!-- Donghua dari situs sumber (AnimeKu & Oploverz) — 24 Okt 2026, permintaan pengguna:
             "jangan AniList saja". Grid metadata di bawah tetap jadi cadangan. -->
        <div class="donghua-sites" id="donghuaSites" aria-busy="false"></div>
        <p class="donghua-note" id="donghuaNote"></p>
        <div class="anime-grid" id="donghuaGrid" aria-busy="true"></div>
    </section>

</main>

<!-- Footer (komponen bersama, dirender oleh js/ui/footer.js) -->
<div id="app-footer"></div>

</body>
</html>
